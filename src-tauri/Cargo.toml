[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.25.10"
imageproc = "0.27.0"
image_hasher = "3.1.1"
rawloader = "0.37.1"
imagepipe = "0.5.0"
# Dynamic-loading mode: ONNX Runtime is loaded from onnxruntime.dll at runtime
# rather than statically linked. This avoids linking the prebuilt static lib,
# which requires a newer MSVC toolset (>=17.10) than may be installed. Provide
# the DLL at runtime via the ORT_DYLIB_PATH env var (see face.rs docs).
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-24"] }
ndarray = "0.17.2"
kamadak-exif = "0.6.1"
chrono = "0.4.45"

